<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self';">
<title>Notes</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/ui.css">
<style>
  :root {
    /* A note's colour is its own data, shared with the phone and the watch (Theme.kt). These stay
       the same in every theme and always carry --on-candy, as the bar's colours do. */
    --note-yellow: #ffc900;
    --note-pink: #ff90e8;
    --note-green: #9ee7c8;
    --note-blue: #a9d5ff;
    --note-purple: #c5b3f6;
    --code-font: ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  /* The frame belongs on #app: main.js rounds it there on Linux, and 12px is that radius. */
  body.panel-window { border: 0; border-radius: 12px; user-select: none; }
  #app {
    --frame: var(--ink);
    position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--bg);
    border: var(--bw) solid var(--frame); border-radius: 12px;
    overflow: clip;
  }

  .view { position: relative; flex: 1; min-height: 0; display: none; flex-direction: column; }
  .view.active { display: flex; animation: view-in 0.16s ease-out; }
  @keyframes view-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .sr-only, body.mode-embed #boardTitle {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  /* The bar and the row of tools under it */
  .head { flex: none; }
  .winbar :focus-visible { outline-color: var(--bar-ink); }
  .winbar h1 { white-space: nowrap; }
  .winbar .note-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    font-size: 13.5px; letter-spacing: 0; text-transform: none;
  }
  .winbar .back { margin: 0 0 0 -8px; }
  .win-btns { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }

  .tools { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
  .tools .field { flex: 1; min-width: 0; }
  .tools .btn { height: 34px; flex: none; }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .tools-end { margin-left: auto; display: flex; align-items: center; gap: 4px; }

  .switch {
    display: inline-flex; flex: none; overflow: hidden;
    background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r-sm);
  }
  .switch button { height: 28px; padding: 0 12px; font-size: 13px; font-weight: 700; color: var(--text-dim); }
  .switch button:hover { background: var(--hover); color: var(--text); }
  .switch button.on { background: var(--ink); color: var(--surface); }
  .switch button:focus-visible { outline-offset: -4px; }
  .switch button.on:focus-visible { outline-color: var(--surface); }

  /* Paper colours: what a note, its swatch and its stripe in the archive are painted with. */
  .c-default { --paper: var(--surface); }
  .c-yellow { --paper: var(--note-yellow); }
  .c-pink { --paper: var(--note-pink); }
  .c-green { --paper: var(--note-green); }
  .c-blue { --paper: var(--note-blue); }
  .c-purple { --paper: var(--note-purple); }

  /* Board */
  .board {
    flex: 1; min-height: 0; overflow-y: auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr));
    grid-auto-rows: min-content; align-content: start; gap: 12px;
    padding: 6px 14px 16px 10px;
  }
  .scard {
    position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 116px; padding: 11px 12px 6px;
    background: var(--paper); color: var(--text);
    border: var(--bw) solid var(--frame); border-radius: var(--r); box-shadow: var(--shadow);
    transition: transform 0.12s var(--pop), box-shadow 0.12s var(--pop);
  }
  /* On candy the tokens that are meant for the page have to mean the paper instead. */
  .scard.candy {
    --ink: var(--on-candy);
    --text: var(--on-candy);
    --text-dim: var(--on-yellow-dim);
    --crit-text: var(--on-candy);
    --hover: color-mix(in srgb, var(--on-candy) 14%, transparent);
  }
  .scard:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--frame); }
  .scard:has(.sc-open:active) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--frame); }
  .scard:has(.sc-open:focus-visible) { outline: 3px solid var(--frame); outline-offset: 2px; }

  /* The title is the card's one real button, stretched over the card. Tags and delete sit above it. */
  .sc-open { display: block; width: 100%; padding: 0; text-align: left; color: inherit; }
  .sc-open:focus-visible { outline: none; }
  .sc-open::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
  .sc-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 14px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere;
  }
  .sc-tags { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 4px; }
  .sc-tag {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    background: var(--ink); color: var(--paper);
  }
  .sc-tag:hover { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .sc-body {
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 13px; font-weight: 500; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere;
  }
  .sc-body.is-empty { color: var(--text-dim); }
  .sc-meta {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between; min-height: 28px;
    font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  .sc-del { position: relative; z-index: 1; margin-right: -6px; opacity: 0; }
  .scard:hover .sc-del, .scard:focus-within .sc-del { opacity: 1; }

  .board-empty {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 44px 16px; text-align: center; font-size: 14px; color: var(--text-dim);
  }
  .board-empty svg { width: 34px; height: 34px; }
  .board-empty p { margin: 0; }
  .board-empty b { display: block; font-size: 15px; font-weight: 800; color: var(--text); }

  /* Deleted notes: takes the place of the tools and the board. */
  .archive-open .tools, .archive-open .board { display: none; }
  .archive-panel {
    flex: 1; min-height: 0; display: none; flex-direction: column; gap: 10px;
    padding: 10px 14px 16px 10px; overflow-y: auto;
  }
  .archive-panel.visible { display: flex; }
  .archive-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
  .archive-header h2 { margin: 0; font-size: 15px; font-weight: 800; }
  .archive-list { flex: none; overflow: hidden; box-shadow: var(--shadow-sm); }
  .archive-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px; min-height: 48px; padding: 6px 10px; }
  .archive-item + .archive-item { border-top: 2px solid var(--ink); }
  .archive-stripe { width: 8px; align-self: stretch; min-height: 26px; background: var(--paper); border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink); }
  .archive-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .archive-date { font-size: 12px; color: var(--text-dim); }

  /* Editor */
  /* Clip, not hidden: the closed drawer waits past the edge, and a hidden overflow can still be scrolled
     to by focus or by a caret, which would slide the whole note sideways. */
  .ed-content { position: relative; flex: 1; min-height: 0; display: flex; overflow: clip; background: var(--surface); border-top: var(--bw) solid var(--ink); }
  .raw { position: relative; flex: 1 1 50%; min-width: 0; display: none; flex-direction: column; }
  .editor-view.editing .raw { display: flex; border-right: var(--bw) solid var(--ink); }
  .raw-head, .prev-head { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .raw-head { flex: none; padding: 8px 14px 2px; }
  .prev-head { display: none; padding: 0 0 8px; }
  .editor-view.editing .prev-head { display: block; }
  .raw textarea {
    flex: 1; min-height: 0; width: 100%; padding: 4px 14px 14px;
    border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font-family: var(--code-font); font-size: 13px; line-height: 1.65;
  }
  .raw textarea::placeholder { color: var(--text-dim); }
  .raw textarea:focus { box-shadow: inset 0 2px 0 var(--ink); }

  /* Position: the outline and the scroll sync measure blocks from this box. */
  .rendered { position: relative; flex: 1 1 50%; min-width: 0; overflow-y: auto; padding: 14px 18px; background: var(--surface); }
  #renderOut { max-width: 760px; }
  .rendered h1 { margin: 2px 0 10px; padding-bottom: 6px; border-bottom: 3px solid var(--ink); font-size: 20px; font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
  .rendered h2 {
    display: inline-block; margin: 14px 0 6px; padding: 2px 8px; max-width: 100%;
    background: var(--yellow); color: var(--on-candy); border: 2px solid var(--ink); border-radius: 6px;
    font-size: 14.5px; font-weight: 800; overflow-wrap: anywhere;
  }
  .rendered p { margin: 6px 0; font-size: 14px; font-weight: 500; line-height: 1.55; overflow-wrap: anywhere; }
  .rendered strong { font-weight: 800; }
  .rendered a { color: inherit; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; }
  .rendered ul { list-style: none; margin: 6px 0; padding: 0; }
  .rendered li { position: relative; padding: 3px 0 3px 18px; font-size: 14px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
  .rendered li::before { content: ''; position: absolute; left: 3px; top: 0.72em; width: 6px; height: 6px; background: var(--ink); border-radius: 1px; }
  .rendered li.chk { display: flex; align-items: flex-start; gap: 8px; padding-left: 0; }
  .rendered li.chk::before { display: none; }
  .chk-text { min-width: 0; }
  .chk.done .chk-text { color: var(--text-dim); text-decoration: line-through; }
  .rendered blockquote {
    margin: 10px 0; padding: 8px 11px; font-size: 13.5px; font-weight: 600; line-height: 1.5;
    background: var(--surface2); border: 2px solid var(--ink); border-left: 6px solid var(--yellow); border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .rendered code, .helper code, .slash-item code {
    padding: 1px 6px; border-radius: 5px;
    background: var(--ink); color: var(--surface);
    font-family: var(--code-font); font-size: 12.5px; font-weight: 600;
  }
  .rendered code.copyable { cursor: pointer; }
  .rendered code.copyable svg { width: 12px; height: 12px; margin-left: 5px; vertical-align: -1px; }
  .rendered code.copyable:hover { background: var(--accent); color: var(--on-accent); }
  .rendered code.copyable.copied { background: var(--yellow); color: var(--on-candy); }
  .rendered .empty-note { font-size: 14px; color: var(--text-dim); cursor: pointer; }
  .md-hr { margin: 14px 0; border: 0; border-top: 3px solid var(--ink); }

  .copy-card {
    display: flex; margin: 10px 0; overflow: hidden;
    background: var(--surface2); border: var(--bw) solid var(--ink); border-radius: var(--r-sm); box-shadow: var(--shadow-sm);
  }
  .copy-card-text { flex: 1; min-width: 0; align-self: center; padding: 8px 12px; font-family: var(--code-font); font-size: 12.5px; font-weight: 600; white-space: pre-wrap; word-break: break-all; }
  .copy-card-btn { flex: none; padding: 0 14px; background: var(--accent); color: var(--on-accent); border-left: var(--bw) solid var(--ink); font-size: 13px; font-weight: 800; }
  .copy-card-btn:hover { box-shadow: inset 0 0 0 2px var(--on-accent); }
  .copy-card-btn:focus-visible { outline-color: var(--on-accent); outline-offset: -5px; }
  .copy-card-btn.done { background: var(--yellow); color: var(--on-candy); }
  .copy-card-btn.done:focus-visible { outline-color: var(--on-candy); }

  .md-table { width: 100%; max-width: 640px; margin: 10px 0; overflow: hidden; border-collapse: separate; border-spacing: 0; border: var(--bw) solid var(--ink); border-radius: var(--r-sm); font-size: 13px; }
  .md-table th, .md-table td { overflow-wrap: anywhere; }
  .md-table th { padding: 6px 9px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 800; text-align: left; }
  .md-table th code { background: var(--surface); color: var(--ink); }
  .md-table td { padding: 0; border-top: 2px solid var(--ink); vertical-align: middle; }
  .md-table td:not(:last-child) { border-right: 2px solid var(--ink); }
  .md-table td.mdt-lbl { padding: 6px 9px; font-weight: 600; line-height: 1.4; }
  .mdt-cell { position: relative; display: flex; align-items: center; min-height: 30px; min-width: 82px; padding: 6px 9px; overflow: hidden; }
  /* Held low enough that the value printed over the bar stays readable in every theme. */
  .mdt-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); opacity: 0.25; }
  .mdt-bar.hatch { background: repeating-linear-gradient(45deg, var(--green) 0 5px, transparent 5px 10px); }
  .mdt-val { position: relative; font-family: var(--code-font); font-size: 12.5px; font-weight: 700; overflow-wrap: anywhere; }
  .mdt-cell.txt .mdt-val { font-family: inherit; font-size: 12px; }

  .editor-view:not(.editing) #renderOut > [data-line]:not(.md-table):not(.copy-card):hover,
  .editor-view:not(.editing) #renderOut ul li[data-line]:hover {
    outline: 2px dashed color-mix(in srgb, var(--ink) 40%, transparent); outline-offset: 3px; border-radius: 4px; cursor: text;
  }
  .blk-edit { display: block; margin: 6px 0; font-family: var(--code-font); font-size: 13px; line-height: 1.55; resize: none; box-shadow: var(--shadow-sm); }

  /* Outline and syntax drawer. Hidden, not only moved away, so Tab can't land inside it while closed. */
  .helper {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 5; width: min(250px, 100%);
    display: flex; flex-direction: column;
    background: var(--surface); border-left: var(--bw) solid var(--ink);
    transform: translateX(100%); visibility: hidden;
    transition: transform 0.18s ease-out, visibility 0s linear 0.18s;
  }
  .helper.open { transform: none; visibility: visible; transition: transform 0.18s ease-out, visibility 0s; }
  .helper-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: none; padding: 8px; border-bottom: 2px solid var(--ink); }
  .helper-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .helper-panel.hidden { display: none; }
  .ol-item, .cheat-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 6px; text-align: left; font-size: 13px; }
  .ol-item { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-item.h2 { width: calc(100% - 12px); margin-left: 12px; font-weight: 600; }
  .ol-item:hover, .cheat-row:hover { background: var(--hover); }
  .ol-item:focus-visible, .cheat-row:focus-visible { outline-offset: -2px; }
  .ol-empty, .cheat-tip { font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
  .ol-empty { padding: 6px; }
  .cheat-row { font-weight: 600; }
  .cheat-row code { flex: none; }
  .cheat-tip { margin: 10px 2px 2px; }

  .capture-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: var(--bw) solid var(--ink); }
  .editor-view.editing .capture-bar { display: none; }
  .capture-bar .field { flex: 1; min-width: 0; }
  .capture-bar .btn { height: 34px; flex: none; }

  .ed-foot { position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; min-height: 36px; padding: 4px 10px; border-top: 2px solid var(--ink); }
  .wc { font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .cpick { display: flex; gap: 4px; }
  .swatch { width: 22px; height: 22px; padding: 0; background: var(--paper); border: 2px solid var(--frame); border-radius: 6px; }
  .swatch[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--frame); }
  .swatch:focus-visible { outline-offset: 5px; }
  /* Sits on the word count for a moment, so it never moves anything. */
  .saved-chip { position: absolute; left: 10px; top: 9px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .saved-chip.show { opacity: 1; }

  /* Slash menu and export menu */
  .slash-menu {
    position: absolute; left: 14px; z-index: 50; width: min(224px, calc(100% - 28px)); overflow-y: auto;
    display: none; flex-direction: column; gap: 2px; padding: 5px;
    background: var(--surface); border: var(--bw) solid var(--ink); border-radius: var(--r-sm); box-shadow: var(--shadow);
  }
  .slash-menu.open { display: flex; }
  .slash-item { display: flex; align-items: center; gap: 8px; flex: none; padding: 5px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .slash-item code { flex: none; min-width: 38px; text-align: center; }
  .slash-item:hover { background: var(--hover); }
  .slash-item.sel { background: var(--yellow); color: var(--on-candy); }

  .share-wrap { position: relative; display: flex; }
  .share-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: min(236px, calc(100vw - 28px));
    display: none; flex-direction: column; gap: 4px; padding: 8px;
    background: var(--surface); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow);
  }
  .share-menu.open { display: flex; }
  .share-head { padding: 0 4px 2px; font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .share-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border-radius: var(--r-sm); text-align: left; }
  .share-opt:hover { background: var(--hover); }
  .share-ic { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 6px; font-family: var(--code-font); font-size: 11px; font-weight: 800; }
  .share-ic.md { background: var(--yellow); color: var(--on-candy); }
  .share-ic.pdf { background: var(--accent); color: var(--on-accent); }
  .share-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
  .share-txt b { font-size: 13.5px; font-weight: 800; }
  .share-txt small { font-size: 12px; font-weight: 500; color: var(--text-dim); }

  .export-toast {
    position: fixed; left: 50%; bottom: 16px; z-index: 60; max-width: calc(100% - 32px); padding: 8px 14px;
    background: var(--bar); color: var(--bar-ink);
    border: 2px solid var(--ink); border-radius: var(--r-sm); box-shadow: var(--shadow-sm);
    font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none; transform: translate(-50%, 12px);
    transition: opacity 0.15s, transform 0.15s var(--pop);
  }
  .export-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .export-toast.err { padding-left: 18px; box-shadow: var(--shadow-sm), inset 8px 0 0 var(--red); }

  /* The snap glow has to pass over the bars and the paper, so it is a layer of its own. */
  .glow-layer { position: absolute; inset: 0; z-index: 70; border-radius: inherit; pointer-events: none; }

  /* A scrolling area that takes focus itself: its edge is clipped, so the ring goes inside. */
  .board:focus-visible, .rendered:focus-visible, .helper-panel:focus-visible, .archive-panel:focus-visible { outline-offset: -3px; }

  /* A narrow window */
  @media (max-width: 520px) {
    .editor-view.editing .ed-content { flex-direction: column; }
    .editor-view.editing .raw { border-right: 0; border-bottom: var(--bw) solid var(--ink); }
    .rendered { padding: 12px; }
  }
  @media (max-width: 340px) {
    .btn-text, .wc-kind { display: none; }
    #addNoteBtn { width: 34px; padding: 0; }
    .helper { width: 100%; border-left: 0; }
    .tools { gap: 6px; padding: 8px 8px 6px; }
    .board { padding: 6px 12px 14px 8px; }
  }
  /* A short window: the note itself comes first. */
  @media (max-height: 340px) {
    .capture-bar { display: none; }
  }
  @media (max-height: 240px) {
    .ed-foot { display: none; }
  }
  /* Small both ways: two stacked panes would leave neither any use, so editing keeps the source. */
  @media (max-width: 520px) and (max-height: 420px) {
    .editor-view.editing .rendered { display: none; }
    .editor-view.editing .raw { border-bottom: 0; }
  }
  /* A wide window */
  @media (min-width: 700px) {
    .board { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .sc-body { -webkit-line-clamp: 7; }
    .rendered { padding: 18px 24px; }
  }

  /* Inside the dashboard: no window around the page, and the bar's colours give way to the page's. */
  body.panel-window.mode-embed { border-radius: 0; }
  body.mode-embed #app { border: 0; border-radius: 0; }
  body.mode-embed .win-btns { display: none; }
  body.mode-embed .head { display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px 16px; }
  body.mode-embed .winbar {
    --bar: transparent;
    --bar-ink: var(--text);
    --bar-dim: var(--text-dim);
    --bar-hover: var(--hover);
    flex: 1; min-width: 0; height: 34px; padding: 0;
    -webkit-app-region: no-drag;
  }
  body.mode-embed .winbar .back { margin: 0; }
  body.mode-embed .winbar .note-name { font-size: 15px; }
  body.mode-embed .tools { flex: none; padding: 0; }
  body.mode-embed #boardView .winbar { flex: none; }
  body.mode-embed #boardView .tools { flex: 1; min-width: 0; }
  body.mode-embed .winbar .count { font-size: 13px; font-weight: 600; }
  body.mode-embed .board { padding: 6px 18px 20px 16px; }
  body.mode-embed .archive-panel { padding: 4px 18px 20px 16px; }
</style>
</head>
<body class="panel-window">
<div id="app">

  <section class="view active" id="boardView" aria-label="Notes board">
    <div class="head">
      <header class="winbar">
        <h1 id="boardTitle">Notes</h1>
        <span class="count" id="noteCount"></span>
        <div class="win-btns">
          <button class="icon-btn" id="minBtnBoard" type="button" title="Minimize" aria-label="Minimize"></button>
          <button class="icon-btn" id="closeBtnBoard" type="button" title="Close" aria-label="Close"></button>
        </div>
      </header>
      <div class="tools">
        <input class="field" id="boardSearch" type="text" placeholder="Search or #tag" aria-label="Search notes, or filter by #tag" spellcheck="false">
        <button class="btn primary" id="addNoteBtn" type="button" title="New note" aria-label="New note"><span class="btn-text">New note</span></button>
        <button class="icon-btn" id="archiveBtn" type="button" title="Deleted notes" aria-label="Deleted notes"></button>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="archive-panel" id="archivePanel"></div>
  </section>

  <section class="view editor-view" id="editorView" aria-label="Note">
    <div class="head">
      <header class="winbar">
        <button class="icon-btn back" id="backBtn" type="button" title="Back to board" aria-label="Back to board"></button>
        <h1 class="note-name" id="editorTitle">Untitled</h1>
        <div class="win-btns">
          <button class="icon-btn" id="minBtnEd" type="button" title="Minimize" aria-label="Minimize"></button>
          <button class="icon-btn" id="closeBtnEd" type="button" title="Close" aria-label="Close"></button>
        </div>
      </header>
      <div class="tools">
        <div class="switch" role="group" aria-label="View">
          <button id="readBtn" class="on" type="button" aria-pressed="true">Read</button>
          <button id="editBtn" type="button" aria-pressed="false">Edit</button>
        </div>
        <div class="tools-end">
          <button class="icon-btn" id="helpBtn" type="button" title="Outline and Markdown help" aria-label="Outline and Markdown help" aria-expanded="false" aria-controls="helper"></button>
          <div class="share-wrap">
            <button class="icon-btn" id="shareBtn" type="button" title="Export" aria-label="Export" aria-expanded="false" aria-controls="shareMenu"></button>
            <div class="share-menu" id="shareMenu">
              <div class="share-head">Export note</div>
              <button class="share-opt" id="exportMdBtn" type="button">
                <span class="share-ic md" aria-hidden="true">MD</span>
                <span class="share-txt"><b>Markdown (.md)</b><small>The source text, tidied</small></span>
              </button>
              <button class="share-opt" id="exportPdfBtn" type="button">
                <span class="share-ic pdf" aria-hidden="true">PDF</span>
                <span class="share-txt"><b>PDF (.pdf)</b><small>Formatted, text can be copied</small></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="ed-content" id="edContent">
      <div class="raw" id="rawPane">
        <div class="raw-head">Markdown source</div>
        <textarea id="md" spellcheck="true" aria-label="Note text in Markdown" placeholder="# Title&#10;&#10;Write in Markdown. Type / for commands."></textarea>
        <div class="slash-menu" id="slashMenu" role="listbox" aria-label="Insert"></div>
      </div>
      <div class="rendered" id="rendered">
        <div class="prev-head">Live preview</div>
        <div id="renderOut"></div>
      </div>
      <div class="helper" id="helper">
        <div class="helper-head">
          <div class="switch" role="group" aria-label="Helper">
            <button id="tabOutline" class="on" type="button" aria-pressed="true">Outline</button>
            <button id="tabSyntax" type="button" aria-pressed="false">Syntax</button>
          </div>
          <button class="icon-btn" id="helperClose" type="button" title="Close helper" aria-label="Close helper"></button>
        </div>
        <div class="helper-panel" id="panelOutline"></div>
        <div class="helper-panel hidden" id="panelSyntax">
          <button class="cheat-row" type="button" data-ins="# "><code>#</code><span>Big heading</span></button>
          <button class="cheat-row" type="button" data-ins="## "><code>##</code><span>Section</span></button>
          <button class="cheat-row" type="button" data-ins="- "><code>-</code><span>Bullet</span></button>
          <button class="cheat-row" type="button" data-ins="- [ ] "><code>- [ ]</code><span>Checkbox</span></button>
          <button class="cheat-row" type="button" data-ins="**bold**"><code>**b**</code><span>Bold</span></button>
          <button class="cheat-row" type="button" data-ins="`code`"><code>`code`</code><span>Code</span></button>
          <button class="cheat-row" type="button" data-ins="> "><code>&gt;</code><span>Callout</span></button>
          <button class="cheat-row" type="button" data-ins="[text](url)"><code>[](url)</code><span>Link</span></button>
          <button class="cheat-row" type="button" data-ins="| Метрика | Стойност |&#10;| --- | --- |&#10;| ред 1 | 11 |&#10;| ред 2 | 38 |&#10;"><code>| |</code><span>Table with bars</span></button>
          <button class="cheat-row" type="button" data-ins="copy: "><code>copy:</code><span>Copy button</span></button>
          <p class="cheat-tip">Type <code>/</code> at a line start for quick-insert commands. Wrap a key or link in <code>`backticks`</code> to copy it with a click, or start a line with <code>copy:</code> for a Copy button. In Read mode, click any block to edit it in place.</p>
        </div>
      </div>
    </div>
    <div class="capture-bar" id="captureBar">
      <input class="field" id="captureInput" type="text" placeholder="Quick add, press Enter" aria-label="Quick add to this note" spellcheck="true">
      <button class="btn primary" id="captureBtn" type="button" title="Add to the end of this note">Add</button>
    </div>
    <div class="ed-foot">
      <span class="wc" id="wc"></span>
      <span class="tag candy saved-chip" id="savedChip">Saved</span>
      <div class="cpick" id="colorPick" role="group" aria-label="Note colour"></div>
    </div>
  </section>

  <div class="glow-layer" id="glowLayer" aria-hidden="true"></div>
</div>
<div class="export-toast" id="exportToast" role="status"></div>
<div class="sr-only" id="liveStatus" role="status"></div>
<script src="ui-theme.js"></script>
<script src="notes-renderer.js"></script>
</body>
</html>
