<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
<title>Claude Meter Alert</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/ui.css">
<style>
  /* Ink reads on every theme's red except these two, which are too dark for it. */
  :root { --on-red: var(--on-candy); }
  :root[data-theme='karchx'], :root[data-theme='light'] { --on-red: var(--bar-ink); }

  html, body { height: 100%; }
  /* Paper on macOS and Windows. On Linux main.js clears it and only the card shows.
     The padding is the room the card's hard shadow needs inside the window. */
  body {
    margin: 0; padding: 4px 8px 8px 4px; overflow: hidden; user-select: none;
    background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; font-variant-numeric: tabular-nums lining-nums;
    -webkit-font-smoothing: antialiased;
    /* The themes' own dim text is under AA on the nord and dracula surfaces. */
  }

  .popup {
    position: relative; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
    animation: pop-in 0.25s var(--pop);
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .strip {
    display: flex; align-items: center; gap: 7px; height: 28px; flex: none; padding: 0 12px;
    background: var(--bar); color: var(--bar-ink);
    border-bottom: 2px solid var(--ink);
    font-size: 12.5px; font-weight: 800;
  }
  .popup.warn .strip { background: var(--yellow); color: var(--on-candy); }
  .popup.crit .strip { background: var(--red); color: var(--on-red); }
  .strip-icon { display: grid; place-items: center; flex: none; }
  .strip-icon svg { width: 15px; height: 15px; display: block; }
  .strip-icon.urgent { animation: icon-shake 0.6s ease-in-out 3; }
  @keyframes icon-shake {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }

  .popup-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 8px 12px 12px;
  }
  .popup-head { display: flex; align-items: flex-start; gap: 10px; flex: none; margin-top: auto; }
  .popup-title {
    flex: 1; min-width: 0;
    font-size: 15px; line-height: 19px; font-weight: 800;
    overflow: hidden; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .popup.digest-mode .popup-title { font-size: 18px; line-height: 22px; font-weight: 900; }
  .pct { flex: none; line-height: 1; white-space: nowrap; }
  .pct b { font-size: 24px; font-weight: 900; }
  .pct small { margin-left: 1px; font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .popup-subtitle {
    flex: none; margin-top: 2px;
    font-size: 12.5px; line-height: 17px; color: var(--text-dim); overflow-wrap: anywhere;
  }

  /* main.js sizes the window at 20px a line, so this line height is load-bearing. */
  .digest {
    flex: 1 1 auto; min-height: 0; margin: 6px 0 0; padding: 0; list-style: none;
    overflow-y: auto; font-size: 13px; line-height: 20px;
  }
  .digest-fact { font-weight: 700; }
  .digest-event { display: flex; gap: 8px; }
  .digest-time { flex: none; min-width: 46px; font-weight: 700; }
  .digest-what { min-width: 0; overflow-wrap: anywhere; }
  .digest-event + .digest-fact { margin-top: 3px; }

  .timer { display: flex; align-items: center; gap: 6px; flex: none; margin-top: 6px; font-size: 12.5px; color: var(--text-dim); }
  .timer-value { padding: 0 4px; border-radius: 5px; font-size: 20px; line-height: 24px; font-weight: 900; color: var(--text); }
  .timer-value.soon { background: var(--yellow); color: var(--on-candy); }
  .timer-value.now { background: var(--red); color: var(--on-red); }

  /* The 12 cells, the same meter as on the widget. */
  .cells { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 13px; flex: none; margin-top: 8px; }
  .cells u { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 4px; text-decoration: none; }
  .cells u.on { background: var(--green); }
  .cells.warm u.on { background: var(--yellow); }
  .cells.hot u.on { background: var(--red); }

  .actions { display: flex; justify-content: flex-end; flex: none; margin-top: auto; padding-top: 8px; }

  /* Time left before it closes by itself. */
  .countdown { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; }
  .countdown div { height: 100%; border-radius: 2px; background: var(--ink); transform-origin: left center; }
  @keyframes cd { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* Last, so it beats the display of each block above. */
  [hidden] { display: none; }
</style>
</head>
<body>
<div class="card raised popup" id="popup" role="alert">
  <header class="strip">
    <span class="strip-icon" id="popupIcon"></span>
    <span id="popupLabel"></span>
  </header>
  <div class="popup-body">
    <div class="popup-head">
      <div class="popup-title" id="popupTitle"></div>
      <div class="pct" id="popupPct" hidden><b id="popupPctValue"></b><small>%</small></div>
    </div>
    <div class="popup-subtitle" id="popupSubtitle"></div>
    <ul class="digest" id="popupDigest" aria-label="Your day" hidden></ul>
    <div class="timer" id="popupTimer" hidden>
      <span class="timer-value" id="popupTimerValue">5:00</span>
      <span>until event</span>
    </div>
    <div class="cells" id="popupCells" role="img" hidden></div>
    <div class="actions">
      <button class="btn" id="popupDismiss" type="button">Dismiss</button>
    </div>
  </div>
  <div class="countdown" id="popupCountdown" hidden><div id="popupCountdownFill"></div></div>
</div>
<script src="ui-theme.js"></script>
<script src="widget-lib.js"></script>
<script src="popup-renderer.js"></script>
</body>
</html>
