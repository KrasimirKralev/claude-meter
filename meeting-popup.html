<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
<title>Meeting Reminder</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/ui.css">
<style>
  /* Ink reads on every theme's red except these two, which are too dark for it. */
  :root { --on-red: var(--on-candy); }
  :root[data-theme='karchx'], :root[data-theme='light'] { --on-red: var(--bar-ink); }

  html, body { height: 100%; }
  /* Paper on macOS and Windows. On Linux main.js clears it and only the card shows.
     The padding is the room the card's hard shadow needs inside the window. */
  body {
    margin: 0; padding: 4px 8px 8px 4px; overflow: hidden; user-select: none;
    background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; font-variant-numeric: tabular-nums lining-nums;
    -webkit-font-smoothing: antialiased;
    /* The themes' own dim text is under AA on the nord and dracula surfaces. */
  }

  .popup {
    position: relative; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
    animation: pop-in 0.25s var(--pop);
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .strip {
    display: flex; align-items: center; height: 28px; flex: none; padding: 0 12px;
    background: var(--bar); color: var(--bar-ink);
    border-bottom: 2px solid var(--ink);
    font-size: 12.5px; font-weight: 800;
  }
  .popup.warn .strip { background: var(--yellow); color: var(--on-candy); }
  .popup.crit .strip { background: var(--red); color: var(--on-red); }

  .popup-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px 12px; text-align: center;
  }

  .ring-wrap { position: relative; width: 78px; height: 78px; flex: none; margin: auto 0 8px; }
  .ring-svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-edge { fill: none; stroke: var(--ink); stroke-width: 2; }
  .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 11; }
  .ring-fill {
    fill: none; stroke: var(--ink); stroke-width: 11;
    stroke-dasharray: 100; stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s ease;
  }
  .popup.warn .ring-fill { stroke: var(--yellow); }
  .popup.crit .ring-fill { stroke: var(--red); }
  .ring-icon { position: absolute; inset: 0; display: grid; place-items: center; }
  .ring-icon svg { width: 24px; height: 24px; display: block; }
  .ring-icon.pulse { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .event-name {
    flex: none; max-width: 100%;
    font-size: 15.5px; line-height: 20px; font-weight: 900;
    overflow: hidden; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
  }
  .subtitle { flex: none; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--text-dim); }

  .btn-row { display: flex; justify-content: center; gap: 8px; flex: none; margin-top: auto; padding-top: 8px; }
  .btn svg { width: 15px; height: 15px; display: block; }
  .btn[hidden] { display: none; }

  .countdown { flex: none; margin-top: 7px; font-size: 12px; line-height: 16px; color: var(--text-dim); }

  /* Time left before it closes by itself. */
  .progress-bar {
    position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px;
    border-radius: 2px; background: var(--ink); transform-origin: left center;
  }
  .progress-bar[hidden] { display: none; }
  @keyframes progressShrink {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
</style>
</head>
<body>
<div class="card raised popup" id="popup" role="alertdialog" aria-labelledby="title eventName" aria-describedby="subtitle">
  <header class="strip"><span id="title">Upcoming meeting</span></header>
  <div class="popup-body">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 88 88" aria-hidden="true">
        <circle class="ring-bg" cx="44" cy="44" r="36.5"/>
        <circle class="ring-fill" id="ringFill" cx="44" cy="44" r="36.5" pathLength="100"/>
        <circle class="ring-edge" cx="44" cy="44" r="43"/>
        <circle class="ring-edge" cx="44" cy="44" r="30"/>
      </svg>
      <div class="ring-icon" id="ringIcon"></div>
    </div>
    <div class="event-name" id="eventName"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="btn-row">
      <button class="btn primary" id="joinBtn" type="button" hidden>Join</button>
      <button class="btn primary" id="dismissBtn" type="button">Dismiss</button>
    </div>
    <div class="countdown" id="countdown"></div>
  </div>
  <div class="progress-bar" id="progressBar" hidden></div>
</div>
<script src="ui-theme.js"></script>
<script src="meeting-popup-renderer.js"></script>
</body>
</html>
