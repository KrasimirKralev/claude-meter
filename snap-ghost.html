<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline';">
<title>Snap preview</title>
<link rel="stylesheet" href="assets/ui.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* Over any desktop: the ink shows on a light one, the accent ring on a dark one. */
  .ghost {
    width: calc(100% - 8px);
    height: calc(100% - 8px);
    margin: 4px;
    border: var(--bw) solid var(--ink);
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    box-shadow: 0 0 0 2px var(--accent);
    border-radius: 14px;
    animation: ghost-in 0.15s ease-out;
  }
  @keyframes ghost-in {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body><div class="ghost"></div></body></html>
