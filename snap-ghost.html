<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .ghost {
    width: calc(100% - 4px);
    height: calc(100% - 4px);
    margin: 2px;
    border: 2px solid rgba(212, 132, 90, 0.6);
    background: rgba(212, 132, 90, 0.08);
    border-radius: 10px;
    animation: ghost-in 0.15s ease-out;
  }
  @keyframes ghost-in {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body><div class="ghost"></div></body></html>
