<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
<title>Quick task</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/ui.css">
<style>
  /* The themes' own dim text is under AA on the nord and dracula surfaces. */
  body { --text-dim: color-mix(in srgb, var(--text) 72%, var(--surface)); }
  .hint { margin-left: auto; padding-right: 8px; font-size: 12px; color: var(--bar-dim); }
  .capture-body { flex: 1; min-height: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .capture-body .btn { flex: none; height: 34px; }
</style>
</head>
<body class="panel-window">
  <header class="winbar">
    <h1>Quick task</h1>
    <span class="hint">Enter to add, Esc to close</span>
  </header>
  <main class="capture-body">
    <input class="field" id="in" type="text" placeholder="What needs to be done?" maxlength="200" spellcheck="true" autofocus aria-label="New task">
    <button class="btn primary" id="go" type="button">Add task</button>
  </main>
<script src="ui-theme.js"></script>
<script src="capture-renderer.js"></script>
</body>
</html>
