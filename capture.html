<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>Quick note</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0ede4; --surface: #fff; --ink: #111; --dim: #6f6a5e;
    --pink: #ff90e8; --yellow: #ffc900;
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body { height: 100%; }
  body {
    font-family: Inter, system-ui, 'Segoe UI', sans-serif;
    background: var(--bg); overflow: hidden; user-select: none;
    display: flex; flex-direction: column;
    border: 2.5px solid var(--ink);
    animation: popIn 0.16s var(--pop);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  .bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #fff; padding: 6px 11px;
    -webkit-app-region: drag; flex-shrink: 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--pink); border: 1.5px solid #fff; }
  .t { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .hint { margin-left: auto; font-size: 8px; font-weight: 800; opacity: 0.55; letter-spacing: 0.5px; }
  .body { flex: 1; display: flex; align-items: center; padding: 10px 12px; gap: 8px; }
  input {
    flex: 1; min-width: 0;
    border: 2.5px solid var(--ink); border-radius: 9px;
    background: var(--surface); color: var(--ink);
    padding: 9px 12px; font: inherit; font-size: 13px; font-weight: 600;
    outline: none; box-shadow: 3px 3px 0 var(--ink);
  }
  button {
    flex-shrink: 0; height: 40px; padding: 0 15px;
    border: 2.5px solid var(--ink); border-radius: 9px;
    background: var(--yellow); color: var(--ink);
    font-family: inherit; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px;
    cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s var(--pop), box-shadow 0.1s var(--pop);
  }
  button:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(2px,2px); box-shadow: 0.5px 0.5px 0 var(--ink); }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot"></span>
    <span class="t">Quick note &#8594; Inbox</span>
    <span class="hint">ENTER SAVE &#183; ESC CLOSE</span>
  </div>
  <div class="body">
    <input id="in" type="text" placeholder="Jot it down&#8230;" spellcheck="true" autofocus>
    <button id="go">Save</button>
  </div>
<script src="capture-renderer.js"></script>
</body>
</html>
