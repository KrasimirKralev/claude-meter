<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self';">
<title>Claude Meter</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<style>
  /* ============================================================
     CLAUDE METER: POP BRUTALIST, REBUILT
     Ink borders and candy colours, spent on what matters: every
     account in one board, a yellow row for the active one.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0ede4;
    --surface: #ffffff;
    --surface2: #f7f3ea;
    --border: #111111;
    --ink: #111111;
    --text: #111111;
    --text-dim: #5f5a4f;
    --accent: #ff90e8;   /* candy pink */
    --on-accent: #111111;
    --green: #23a094;    /* teal */
    --yellow: #ffc900;   /* taxi yellow */
    --red: #e5484d;
    --crit-text: #c8232b;
    --bar-bg: #ffffff;
    --hover: rgba(17, 17, 17, 0.06);

    /* Fixed in every theme: these sit on the black bar or on a candy colour. */
    --bar: #111111;
    --bar-ink: #ffffff;
    --bar-dim: #b9b5a8;
    --bar-hover: #2c2c2c;
    --on-candy: #111111;
    --on-yellow-dim: #3a3205;

    --bw: 2.5px;                    /* border weight */
    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 2.5px 2.5px 0 var(--ink);
    --r: 12px;
    --r-sm: 8px;
    --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body {
    font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
    font-variant-numeric: tabular-nums lining-nums;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ul { list-style: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .widget {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    border: var(--bw) solid var(--ink);
    border-radius: 14px;
    position: relative;
  }

  /* ---------- Header: ink bar ---------- */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    height: 40px;
    padding: 0 8px 0 14px;
    background: var(--bar);
    color: var(--bar-ink);
  }
  .title { font-size: 12.5px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .dot, .sync-status { display: none; }
  .footer-hint { font-size: 12px; color: var(--bar-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .footer-hint.stale { color: #e6c15a; }
  .footer-hint.error { color: #ff9c9c; }
  .streak-badge {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 11px; font-weight: 800;
    color: var(--on-candy); background: var(--yellow);
    border-radius: 5px; padding: 1px 6px;
    cursor: pointer; flex-shrink: 0;
  }
  .streak-badge .streak-fire { font-size: 11px; }
  .window-controls { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .win-btn {
    width: 28px; height: 28px; display: grid; place-items: center;
    border-radius: 6px; color: var(--bar-dim);
  }
  .win-btn:hover { background: var(--bar-hover); color: var(--bar-ink); }
  .win-btn:focus-visible { outline-color: var(--bar-ink); outline-offset: -2px; }
  .win-btn svg { width: 16px; height: 16px; pointer-events: none; }
  .refresh-btn.spinning svg { animation: spin 0.5s linear 2; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ---------- The answer ---------- */
  .answer { padding: 8px 14px; font-size: 14px; color: var(--text-dim); flex-shrink: 0; }
  .answer b { color: var(--ink); font-weight: 600; white-space: nowrap; }

  /* ---------- Account board ---------- */
  .accts {
    margin: 0 10px;
    flex-shrink: 0;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: var(--r);
    overflow: hidden;
  }
  .accts:empty { display: none; }
  .acct {
    display: grid;
    grid-template-columns: 30px 180px 1fr 62px;
    column-gap: 10px;
    align-items: center;
    min-height: 60px;
    padding: 6px 8px;
    color: var(--ink);
    cursor: pointer;
  }
  .acct + .acct { border-top: 2px solid var(--ink); }
  .acct:hover { background: var(--hover); }
  .acct:focus-visible { outline-offset: -4px; }
  .acct.active, .acct.active:hover { background: var(--yellow); color: var(--on-candy); }
  /* A failed or throttled read: the last numbers stay, faded, and the row says why. */
  .acct.stale .cells { opacity: 0.6; }
  .acct.stale .pct b, .acct.stale .pct small { color: var(--text-dim); }
  /* A row with no bars: its status can use their room. */
  .acct.no-meters { grid-template-columns: 30px 1fr 62px; }
  .bullet {
    width: 26px; height: 26px; display: grid; place-items: center;
    border: 2px solid var(--on-candy); border-radius: 7px;
    font-weight: 900; font-size: 13px; color: var(--on-candy);
  }
  .b-0 { background: var(--green); }
  .b-1 { background: var(--yellow); }
  .b-2 { background: var(--accent); }
  .b-3 { background: #ffffff; }
  .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .name { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; min-width: 0; }
  .name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name em {
    flex-shrink: 0; font-style: normal; font-size: 11px; font-weight: 700;
    padding: 1px 6px; border-radius: 5px;
    background: var(--ink); color: var(--surface);
  }
  .acct.active .name em { background: var(--on-candy); color: #ffffff; }
  /* Outlined, so "where the CLI runs" can't be read as "active". */
  .name em.cli, .acct.active .name em.cli { background: none; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
  .reset { font-size: 12px; line-height: 1.25; color: var(--text-dim); min-height: 15px; }
  .reset strong, .reset span { display: inline-block; }
  .acct.active .reset, .acct.active .lab, .acct.active .pct small { color: var(--on-yellow-dim); }
  .reset strong { color: var(--crit-text); font-weight: 700; }
  .acct.active .reset strong { color: #8f1218; }
  /* One label column per row, so every bar starts at the same place. */
  .meters { display: grid; grid-template-columns: minmax(62px, auto) 1fr; row-gap: 6px; align-items: center; min-width: 0; }
  .meters .wide { grid-column: 1 / -1; }
  .lab { font-size: 11px; color: var(--text-dim); white-space: nowrap; padding-right: 4px; }
  .lab.wide { padding-right: 0; margin-bottom: -3px; }
  .login-btn { grid-column: 1 / -1; justify-self: start; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 700; }
  .login-btn:hover { background: var(--surface2); }
  .pct { text-align: right; line-height: 1; white-space: nowrap; }
  .pct b { font-size: 24px; font-weight: 900; }
  .pct small { font-size: 12px; font-weight: 600; margin-left: 1px; color: var(--text-dim); }
  .crit .pct b, .crit .pct small { color: var(--crit-text); }
  .acct.active.crit .pct b, .acct.active.crit .pct small { color: #8f1218; }
  .acct.active.stale .pct b, .acct.active.stale .pct small { color: var(--on-yellow-dim); }

  /* The 12 cells, the same meter as on the phone and watch. */
  .cells { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 13px; }
  .cells.s { height: 7px; gap: 2px; }
  .cells u { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 4px; text-decoration: none; }
  .cells.s u { border-width: 1px; border-radius: 2px; }
  .cells u.on { background: var(--green); }
  .cells.warm u.on { background: var(--yellow); }
  .cells.hot u.on { background: var(--red); }
  .acct.active .cells u { background: #ffffff; border-color: var(--on-candy); }
  .acct.active .cells u.on { background: var(--on-candy); }
  .acct.active .cells.hot u.on { background: #c8232b; }
  .bar-pulse { animation: barPulse 0.5s ease-out; }
  @keyframes barPulse { 0% { filter: brightness(1.35); } 100% { filter: brightness(1); } }

  /* ---------- Extra usage: only when an account has it on ---------- */
  .usage-rows { flex-shrink: 0; margin: 8px 10px 0; }
  .extra-section { flex-shrink: 0; }
  .extra-strip {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 2px solid var(--ink);
    border-radius: 9px; padding: 6px 11px; cursor: pointer;
  }
  .extra-strip:hover { background: var(--surface2); }
  .extra-strip .es-ic { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink); }
  .extra-strip .es-lbl { font-size: 12px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .extra-strip .es-amt { font-weight: 800; font-size: 13px; color: var(--ink); flex-shrink: 0; }
  .extra-strip .es-cells { flex: 1; min-width: 26px; }
  .extra-strip .es-pct { font-weight: 800; font-size: 12px; color: var(--ink); flex-shrink: 0; min-width: 30px; text-align: right; }
  .usage-rows:not(:has(.extra-section:not([style*="none"]))) { display: none; }

  /* ---------- Today ---------- */
  .today { padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .next-line { display: flex; gap: 4px; font-size: 13px; min-width: 0; color: var(--ink); }
  .next-event { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .next-event:hover, .tasks-left:hover { text-decoration: underline; }
  .next-event b { font-weight: 700; }
  .next-event .more { color: var(--text-dim); font-weight: 600; }
  .tasks-left { color: var(--text-dim); flex-shrink: 0; white-space: nowrap; }
  .widget-habits { display: flex; align-items: center; gap: 6px; min-height: 26px; flex-wrap: wrap; }
  .widget-habits-today { display: contents; }
  .widget-habits-badge {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 10px;
    border: 2px solid var(--ink); border-radius: 99px;
    background: var(--surface); color: var(--ink);
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  button.widget-habits-badge:hover { background: var(--surface2); }
  .widget-habits-badge.on { background: var(--green); color: var(--on-candy); }
  .widget-habits-badge.auto { cursor: default; }
  .widget-habits-ring {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid currentColor;
    background: conic-gradient(currentColor var(--p, 0%), transparent 0);
  }
  .habits-right { margin-left: auto; display: flex; align-items: center; gap: 0; }
  .relax-meta { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .relax-meta:empty { display: none; }
  .relax-now-btn { height: 26px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--text-dim); border-radius: 99px; white-space: nowrap; }
  .relax-now-btn:hover { color: var(--ink); background: var(--hover); }

  /* ---------- Focus timer ---------- */
  .pomo-ring-wrap {
    position: relative;
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 10px;
    border-radius: 99px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pomo-ring-wrap:hover { color: var(--ink); background: var(--hover); }
  .pomo-ring-svg { width: 14px; height: 14px; transform: rotate(-90deg); pointer-events: none; }
  .pomo-idle-icon { display: none; width: 14px; height: 14px; pointer-events: none; }
  .pomo-ring-wrap.idle .pomo-idle-icon { display: block; }
  .pomo-ring-wrap.idle .pomo-ring-svg { display: none; }
  .pomo-ring-bg { fill: none; stroke: currentColor; opacity: 0.25; stroke-width: 3; }
  /* It moves once a second. A transition here would keep it repainting for the whole session. */
  .pomo-ring-fill { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: butt; }
  .pomo-ring-fill.break { stroke: #c78d00; }
  .pomo-ring-fill.idle { stroke: currentColor; stroke-width: 3; }
  .pomo-ring-fill.running { stroke: var(--green); }
  .pomo-ring-text { pointer-events: none; }
  .pomo-ring-text.active { color: var(--ink); }
  .pomo-ring-text.break { color: var(--ink); }
  .pomo-tooltip {
    display: none;
    position: absolute;
    bottom: 32px; right: 0;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow);
    padding: 10px 12px;
    white-space: nowrap;
    z-index: 100;
    min-width: 134px;
    color: var(--ink);
    cursor: default;
  }
  .pomo-tooltip.open { display: block; animation: tooltipIn 0.18s var(--pop); }
  @keyframes tooltipIn {
    0% { opacity: 0; transform: translateY(6px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pomo-tooltip-time { font-size: 22px; font-weight: 900; text-align: center; color: var(--ink); }
  .pomo-tooltip-time.active { color: var(--green); }
  .pomo-tooltip-time.break { color: #c78d00; }
  .pomo-tooltip-label { font-size: 11px; font-weight: 700; text-align: center; color: var(--text-dim); margin-top: 2px; margin-bottom: 8px; }
  .pomo-tooltip-btns { display: flex; gap: 6px; }
  .pomo-tooltip-btn {
    flex: 1; padding: 6px 0; font-size: 12px; font-weight: 800;
    border: 2px solid var(--ink); border-radius: 6px;
    background: var(--surface); color: var(--ink);
    text-align: center;
  }
  .pomo-tooltip-btn.primary { background: var(--green); color: var(--on-candy); }
  .pomo-tooltip-btn:hover { background: var(--surface2); }
  .pomo-tooltip-btn.primary:hover { background: var(--green); filter: brightness(1.08); }

  /* ---------- Pomodoro celebration ---------- */
  .pomo-celebration {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 12px 14px;
    background: var(--green);
    color: var(--on-candy);
    font-size: 13px;
    font-weight: 900;
    text-align: center;
    z-index: 200;
    border-bottom: var(--bw) solid var(--ink);
    overflow: hidden;
  }
  .pomo-celebration.visible { display: block; animation: celebSlide 0.4s var(--pop); }
  @keyframes celebSlide { 0% { transform: translateY(-100%); } 100% { transform: translateY(0); } }
  .pomo-celebration .celeb-text { position: relative; z-index: 2; }
  .pomo-celebration .celeb-sub { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .confetti-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; }
  .confetti { position: absolute; width: 6px; height: 6px; border: 1.5px solid var(--on-candy); top: -10px; animation: confettiFall 2s ease-in forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
  }

  /* ---------- Dock ---------- */
  .dock {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    height: 48px;
    flex-shrink: 0;
    border-top: var(--bw) solid var(--ink);
    background: var(--surface);
    margin-top: auto;
  }
  .dock button {
    min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 800; color: var(--ink);
  }
  .dock button + button { border-left: 2px solid var(--ink); }
  .dock button:hover { background: var(--surface2); }
  .dock button:focus-visible { outline-offset: -4px; }
  .dock .primary { background: var(--accent); color: var(--on-accent); }
  .dock .primary:hover { background: var(--accent); filter: brightness(1.05); }
  .dock svg { width: 18px; height: 18px; flex-shrink: 0; pointer-events: none; }

  /* ---------- Banners ---------- */
  .overdue-banner {
    display: none;
    margin: 0 10px 8px;
    padding: 8px 12px;
    background: var(--red);
    border: 2px solid var(--ink);
    border-radius: var(--r-sm);
    flex-shrink: 0;
    cursor: pointer;
    color: var(--on-candy);
  }
  .overdue-banner.visible { display: flex; align-items: center; gap: 8px; animation: bannerIn 0.3s var(--pop); }
  @keyframes bannerIn { 0% { opacity: 0; transform: translateY(-8px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  .overdue-banner-icon { font-size: 13px; flex-shrink: 0; }
  .overdue-banner-text { flex: 1; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .overdue-banner-time { font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .overdue-banner-close { font-size: 12px; padding: 2px 4px; border-radius: 3px; flex-shrink: 0; font-weight: 900; }
  .overdue-banner-close:hover { background: rgba(0,0,0,0.2); }

  .claude-status-banner {
    display: none; flex-direction: column; gap: 3px;
    margin: 0 10px 8px;
    padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer;
    border: 2px solid var(--ink);
    background: var(--surface);
    flex-shrink: 0;
  }
  .claude-status-banner.minor { background: #fff8e0; }
  .claude-status-banner.major, .claude-status-banner.critical { background: #ffecec; }
  .claude-status-banner.visible { display: flex; animation: bannerIn 0.3s var(--pop); }
  .claude-status-banner-row1 { display: flex; align-items: center; gap: 6px; }
  .claude-status-banner-dot { width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid #111; flex-shrink: 0; }
  .claude-status-banner.minor .claude-status-banner-dot { background: var(--yellow); }
  .claude-status-banner.major .claude-status-banner-dot,
  .claude-status-banner.critical .claude-status-banner-dot { background: var(--red); }
  .claude-status-banner-name { font-size: 13px; font-weight: 800; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; }
  .claude-status-banner-row2 { font-size: 12px; color: #4f4a3f; padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

  /* ---------- Setup overlay ---------- */
  .setup-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    flex: 1;
    min-height: 0;
  }
  .setup-overlay.visible { display: flex; }
  /* The other accounts and every tool stay reachable: only this account's numbers need a login. */
  .widget.setup .answer, .widget.setup .usage-rows { display: none; }
  .setup-overlay .setup-icon { font-size: 34px; margin-bottom: 12px; }
  .setup-overlay .setup-title { font-size: 16px; font-weight: 900; margin-bottom: 6px; color: var(--ink); }
  .setup-overlay .setup-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; font-weight: 600; }
  .setup-overlay .setup-btn {
    padding: 10px 28px; font-size: 13px; font-weight: 900; border-radius: var(--r-sm);
    border: var(--bw) solid var(--ink);
    background: var(--green); color: var(--on-candy);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .setup-overlay .setup-btn:hover { filter: brightness(1.08); }
  .setup-overlay .setup-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .setup-overlay .setup-install-link { font-size: 12px; color: var(--ink); text-decoration: underline; font-weight: 700; }
  .setup-overlay .setup-waiting { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .setup-overlay .setup-waiting .dot { display: block; width: 7px; height: 7px; border-radius: 2px; border: 1.5px solid var(--ink); background: var(--yellow); }

  /* ---------- Update button: only when there is one ---------- */
  .footer { flex-shrink: 0; display: flex; justify-content: center; }
  .footer-update-btn {
    display: none;
    margin-bottom: 8px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 800;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--accent);
    color: var(--on-candy);
  }
  .footer-update-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .footer-update-btn.visible { display: inline-block; }
  .footer-update-btn.downloading {
    background: linear-gradient(90deg, var(--green), var(--green)) no-repeat left, var(--surface);
    background-size: 0% 100%, 100% 100%;
    transition: background-size 0.4s ease;
  }

  /* ---------- Effects ---------- */
  .snap-glow { animation: snapGlow 0.4s ease-out; }
  @keyframes snapGlow {
    0% { box-shadow: 0 0 0 3px var(--yellow); }
    100% { box-shadow: none; }
  }
  .widget.fade-in { animation: widgetIn 0.22s var(--pop) forwards; }
  .widget.fade-out { animation: widgetOut 0.09s cubic-bezier(0.4, 0, 1, 1) forwards; }
  @keyframes widgetIn {
    0% { opacity: 0; transform: translateX(24px) scale(0.96); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes widgetOut {
    0% { opacity: 1; transform: translateX(0) scale(1); }
    100% { opacity: 0; transform: translateX(24px) scale(0.96); }
  }

  /* Compact mode: double-click the title bar. The meters alone. */
  body.compact .answer, body.compact .lab, body.compact .cells.s, body.compact .today { display: none; }
  body.compact .accts { margin-top: 8px; margin-bottom: 8px; }
  body.compact .acct { min-height: 44px; }

  /* Narrow window: meters drop under the name, and the dock keeps its icons. */
  @media (max-width: 470px) {
    .acct { grid-template-columns: 30px 1fr 54px; row-gap: 5px; padding-block: 8px; }
    .meters { grid-column: 1 / -1; grid-row: 2; }
    .dock button { flex-direction: column; gap: 1px; font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 3px; }
  /* A narrow widget: five labels still have to fit along the bottom. */
  @media (max-width: 520px) {
    .dock button { gap: 4px; font-size: 12px; }
    .dock button svg { width: 14px; height: 14px; }
  }
</style>
</head>
<body>

<div class="pomo-celebration" id="pomoCelebration">
  <div class="confetti-container" id="confettiContainer"></div>
  <div class="celeb-text" id="celebText">Focus session complete!</div>
  <div class="celeb-sub">Time for a break</div>
</div>

<div class="widget">
  <div class="header">
    <span class="dot stale" id="statusDot"></span>
    <span class="title">Claude Meter</span>
    <span class="footer-hint" id="footerHint" role="status">Syncing...</span>
    <span class="streak-badge" id="streakBadge" style="display:none;"><span class="streak-fire"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 1.5 1 2 1.5 2C11 8.5 11 6 12 3Z"/></svg></span><span id="streakCount">0</span></span>
    <span class="sync-status" id="syncStatus"></span>
    <div class="window-controls">
      <button class="win-btn refresh-btn" id="refreshBtn" title="Refresh now" aria-label="Refresh now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg></button>
      <button class="win-btn minimize" id="minimizeBtn" title="Minimize widget" aria-label="Minimize widget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="win-btn close" id="closeBtn" title="Hide all panels" aria-label="Hide all panels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    </div>
  </div>

  <p class="answer" id="answerLine" hidden></p>

  <div class="setup-overlay" id="setupOverlay">
    <div class="setup-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0V8ZM12 16v5"/></svg></div>
    <div class="setup-title" id="setupTitle">Connect to Claude</div>
    <div class="setup-desc" id="setupDesc">Sign in with your Anthropic account to start tracking usage.</div>
    <button class="setup-btn" id="setupSignInBtn">Sign In</button>
    <div class="setup-waiting" id="setupWaiting" style="display:none">
      <span class="dot"></span>
      <span>Waiting for browser login...</span>
    </div>
    <button class="setup-install-link" id="setupInstallLink" style="display:none">Install Claude Code first</button>
  </div>

  <div class="overdue-banner" id="overdueBanner">
    <span class="overdue-banner-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 20h18L12 4ZM12 10v5M12 17.5h.01"/></svg></span>
    <span class="overdue-banner-text" id="overdueBannerText"></span>
    <span class="overdue-banner-time" id="overdueBannerTime"></span>
    <button class="overdue-banner-close" id="overdueBannerClose" aria-label="Dismiss"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>

  <div class="claude-status-banner" id="claudeStatusBanner" title="Click to open status.claude.com">
    <div class="claude-status-banner-row1">
      <span class="claude-status-banner-dot"></span>
      <span class="claude-status-banner-name" id="claudeStatusName"></span>
    </div>
    <div class="claude-status-banner-row2" id="claudeStatusMeta"></div>
  </div>

  <ul class="accts" id="accountTabs" aria-label="Accounts"></ul>

  <div class="usage-rows" id="usageRows">
    <div class="extra-section" id="extraSection" style="display:none">
      <div class="extra-strip" id="extraStrip" title="Extra usage this month">
        <svg class="es-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/></svg>
        <span class="es-lbl">Extra</span>
        <span class="es-amt" id="extraAmt">&mdash;</span>
        <div class="es-cells" id="extraCells"></div>
        <span class="es-pct" id="extraPct"></span>
      </div>
    </div>
  </div>

  <div class="today">
    <div class="next-line">
      <button class="next-event" id="nextEvent"></button>
      <button class="tasks-left" id="tasksLeft"></button>
    </div>
    <div class="widget-habits" id="widgetHabits" title="Open Habits dashboard">
      <span class="widget-habits-today" id="widgetHabitsTodayBadges"></span>
      <div class="habits-right">
        <span class="relax-meta" id="relaxMeta"></span>
        <button class="relax-now-btn" id="relaxNowBtn" hidden>Relax now</button>
        <div class="pomo-ring-wrap idle" id="pomoRing" title="Focus timer">
          <svg class="pomo-idle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M10 3h4"/></svg>
          <svg class="pomo-ring-svg" viewBox="0 0 28 28" aria-hidden="true">
            <circle class="pomo-ring-bg" cx="14" cy="14" r="11"/>
            <circle class="pomo-ring-fill idle" id="pomoRingFill" cx="14" cy="14" r="11" stroke-dasharray="69.12" stroke-dashoffset="0"/>
          </svg>
          <div class="pomo-ring-text" id="pomoRingText">Focus 25</div>
          <div class="pomo-tooltip" id="pomoTooltip">
            <div class="pomo-tooltip-time" id="pomoTooltipTime">25:00</div>
            <div class="pomo-tooltip-label" id="pomoTooltipLabel">Focus</div>
            <div class="pomo-tooltip-btns">
              <button class="pomo-tooltip-btn primary" id="pomoStartBtn">Start</button>
              <button class="pomo-tooltip-btn" id="pomoResetBtn">Reset</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="footer-update-btn" id="updateBtn"></button>
  </div>

  <nav class="dock" aria-label="Open">
    <button class="primary" id="mapsBtn" title="Maps" aria-label="Maps" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4c4.4 0 8 2.9 8 6.5S16.4 17 12 17c-.9 0-1.7-.1-2.5-.3L5 19.5l1.2-4C4.8 14.3 4 12.5 4 10.5 4 6.9 7.6 4 12 4Z"/></svg>Maps</button>
    <button id="tasksBtn" title="Tasks" aria-label="Tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Tasks</button>
    <button id="notesBtn" title="Notes" aria-label="Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19l-4 1Z"/></svg>Notes</button>
    <button id="calendarBtn" title="Calendar" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>Calendar</button>
    <button id="dashBtn" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
  </nav>
</div>

<script src="widget-lib.js"></script>
<script src="ui-theme.js"></script>
<script src="renderer.js"></script>
</body>
</html>
