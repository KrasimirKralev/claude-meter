<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
<title>Relax soon</title>
<style>
  /* The widget's Pop Brutalist tokens (index.html :root). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0ede4; --surface: #ffffff; --surface2: #f7f3ea; --ink: #111111;
    --text-dim: #6f6a5e; --accent: #ff90e8; --green: #23a094; --yellow: #ffc900;
    --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body { background: transparent; }
  body {
    font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    height: 100vh;
    padding: 4px 9px 9px 4px;
    -webkit-font-smoothing: antialiased;
  }
  .toast {
    height: 100%;
    background: var(--surface);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 12px 14px 13px;
    display: flex; flex-direction: column; gap: 8px;
    animation: popIn 0.32s var(--pop);
  }
  @keyframes popIn {
    0% { opacity: 0; transform: translateY(10px) scale(0.94); }
    100% { opacity: 1; transform: none; }
  }
  .top { display: flex; align-items: center; gap: 8px; }
  .chip {
    font-size: 8px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase;
    background: var(--accent); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px;
    padding: 2px 6px;
  }
  .segs { display: flex; gap: 3px; margin-left: auto; }
  .seg { width: 13px; height: 9px; border: 2px solid var(--ink); border-radius: 3px; background: var(--surface2); }
  .seg.f { background: var(--green); }
  .title {
    font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .count { font-family: var(--mono); font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; }
  .sub {
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  /* Start now takes the whole first row: it is the one he reaches for. */
  .btn.start { flex-basis: 100%; background: var(--accent); }
  .btn {
    flex: 1;
    padding: 7px 0;
    font-family: inherit; font-size: 10px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.7px;
    color: var(--ink); background: var(--surface);
    border: 2.5px solid var(--ink); border-radius: 9px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.13s var(--pop), box-shadow 0.13s var(--pop);
  }
  .btn.primary { background: var(--yellow); }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0.5px 0.5px 0 var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="toast" role="alertdialog" aria-labelledby="title" aria-describedby="sub">
  <div class="top">
    <span class="chip">Relax</span>
    <span class="segs" id="segs" aria-hidden="true"></span>
  </div>
  <div class="title" id="title"><span>Relax in</span><span class="count" id="count">30</span><span>s</span></div>
  <div class="sub" id="sub">4 min · screens go calm · music</div>
  <div class="btns">
    <button class="btn start" id="startBtn">Start now</button>
    <button class="btn primary" id="laterBtn">Later · 10 min</button>
    <button class="btn" id="skipBtn">Skip</button>
  </div>
</div>
<script src="relax-toast-renderer.js"></script>
</body>
</html>
