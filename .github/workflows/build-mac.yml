name: Build macOS DMG

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'assets/screenshot-*.png'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'assets/screenshot-*.png'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Building runs every dependency's install script, so it gets no write access. Publishing runs nothing of
# the project's, so it can safely hold the one token that can change a release.
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read app version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: npm test && npm run test:maps:install && npm run test:maps

      - name: Build unsigned DMG (Apple Silicon + Intel)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List artifacts
        run: ls -lh dist/*.dmg

      - name: Upload DMGs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-meter-macos
          path: dist/*.dmg

  # clx is Linux only (it reads /proc), so its tests run here, not on the Mac runner.
  clx-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the clx tests
        run: |
          python3 -I clx/test/test-dead-auth.py
          python3 -I clx/test/test-no-5h.py
          python3 -I clx/test/test-move.py
          bash clx/test/test-install.sh

  # A pull request proves the build. Only main publishes one.
  publish:
    needs: [build-mac, clx-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the DMGs
        uses: actions/download-artifact@v4
        with:
          name: claude-meter-macos
          path: dist

      # Packing files runs none of the project's code, so this job may still hold the token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: src

      - name: Pack clx
        run: tar -C src -czf dist/clx.tar.gz --exclude='__pycache__' clx

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-mac.outputs.version }}
          name: Claude Meter for macOS v${{ needs.build-mac.outputs.version }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/clx.tar.gz
          body: |
            **Claude Meter — macOS build (unsigned)**

            Two downloads:
            - `*-arm64.dmg` → Apple Silicon (M1 / M2 / M3 / M4)
            - `*-x64.dmg` → Intel Macs

            ### First launch (one time, because the build is unsigned)
            macOS Gatekeeper blocks apps that aren't signed by an Apple Developer ID. To open it the first time:

            1. Open the `.dmg` and drag **Claude Meter** into **Applications**.
            2. In **Applications**, **right-click** the app → **Open** → **Open** again in the dialog.

            If macOS still refuses ("app is damaged / can't be opened"), open **Terminal** and run:
            ```
            xattr -cr "/Applications/Claude Meter.app"
            ```
            then open it normally. After the first open it launches like any other app.

            ### clx (Linux)
            `clx.tar.gz` holds clx, the launcher that moves a running Claude Code session to another account when one runs out:
            ```
            curl -fsSL https://github.com/KrasimirKralev/claude-meter/releases/latest/download/clx.tar.gz | tar xz
            ./clx/install.sh
            ```
            See [clx/README.md](https://github.com/KrasimirKralev/claude-meter/blob/main/clx/README.md).
